<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2f7" />
  <title>Eko Life — live your Lagos story</title>
  <meta name="description" content="A Sims-style life game set in Lagos. Ride danfo, chop amala, party on the Island, vote for governor." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5" />
  <script>var t = null; try { t = localStorage.getItem('eko-life:theme'); } catch (e) {} document.documentElement.dataset.theme = t || 'light';</script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <main id="city-view">
    <div id="city" class="stage"></div>
    <div id="house" class="stage" hidden></div>

    <!-- Guest chrome -->
    <header class="topbar glass" id="topbar"></header>
    <nav class="chips" id="chips"></nav>
    <div class="announce" id="announce" hidden></div>
    <section class="dock glass" id="dock"></section>

    <!-- Player HUD -->
    <div id="hud" hidden></div>
  </main>

  <main id="auth-view" hidden></main>
  <main id="privacy-view" class="doc" hidden></main>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
  </section>

  <div class="phone-wrap" id="phone" hidden></div>

  <div class="cookie glass" id="cookie" hidden>
    <span class="cookie-emoji">🍪</span>
    <p>We use local storage to keep you signed in and save your Sim. No ad trackers, ever. <a href="#/privacy">Privacy</a></p>
    <div class="cookie-actions">
      <button class="btn soft" data-consent="essential">Essential only</button>
      <button class="btn primary" data-consent="all">Accept</button>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
